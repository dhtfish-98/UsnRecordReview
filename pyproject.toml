[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "usnrecordreview"
version = "1.0.0"
description = "Bounded offline evidence review: UsnRecordReview"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
usnrecordreview = "usnrecordreview.core:main"

[tool.setuptools.packages.find]
where = ["src"]
